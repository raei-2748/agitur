<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#E4EAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1733" media="(prefers-color-scheme: dark)">
  <title>Agitur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <div class="sky" aria-hidden="true"></div>

  <main>
    <header>
      <svg class="cloud" viewBox="0 0 200 150" aria-hidden="true">
        <g class="body">
          <path class="puff" d="M50 120 A30 30 0 0 1 46 60.3 A40 40 0 0 1 120 42.3 A32 32 0 0 1 166 68.3 A28 28 0 0 1 160 120 Z"/>
          <g class="face">
            <g class="eye eye-l">
              <circle cx="86" cy="90" r="6"/>
              <rect class="lid" x="78" y="80" width="16" height="10"/>
            </g>
            <g class="eye eye-r">
              <circle cx="124" cy="90" r="6"/>
              <rect class="lid" x="116" y="80" width="16" height="10"/>
            </g>
            <ellipse class="mouth" cx="105" cy="106" rx="7" ry="1.6"/>
          </g>
        </g>
        <g class="rain">
          <line x1="78" y1="128" x2="74" y2="138"/>
          <line x1="104" y1="128" x2="100" y2="138"/>
          <line x1="130" y1="128" x2="126" y2="138"/>
        </g>
      </svg>

      <div class="title">
        <h1>Agitur</h1>
        <p class="sub">The Academic Portfolio's resident cloud</p>
      </div>

      <label class="switch">
        <input type="checkbox" id="speak">
        <span class="track"><span class="thumb"></span></span>
        <span>Voice</span>
      </label>
    </header>

    <section class="intro" id="intro">
      <p>Ask about study sessions, student voice, Mentor Leaders or Knox Forward. I'll answer, eventually, with a sigh.</p>
      <div class="chips">
        <button type="button" class="chip">What does the Academic Portfolio do?</button>
        <button type="button" class="chip">How does student voice work?</button>
        <button type="button" class="chip">What's Year 11's Knox Forward cause?</button>
      </div>
    </section>

    <section id="log" aria-live="polite"></section>

    <form id="form" autocomplete="off">
      <button type="button" id="mic" class="icon-btn" aria-label="Speak your question" title="Speak">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/>
        </svg>
      </button>
      <input id="input" type="text" placeholder="Ask Agitur something" maxlength="500" aria-label="Message">
      <button type="submit" class="icon-btn send" aria-label="Send" title="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8l-4.6 4.6L5 11l7-7Z"/>
        </svg>
      </button>
    </form>

    <footer>
      Unofficial student project, not endorsed by Knox Grammar School. Messages go to Google's Gemini API, so keep personal details out of them.
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
